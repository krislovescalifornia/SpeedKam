[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "speedkam"
dynamic = ["version"]
description = "Camera-based vehicle speed estimator for private roads (Raspberry Pi / desktop)."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Kris Kling" }]
keywords = ["speed-camera", "opencv", "raspberry-pi", "vehicle-detection", "homography"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video :: Capture",
    "Topic :: Scientific/Engineering :: Image Recognition",
]

# Core runtime deps. On the Raspberry Pi these come from apt (see
# deploy/image/provision.sh), not pip -- this list is for desktop / CI installs.
dependencies = [
    "opencv-python>=4.8",
    "numpy>=1.24",
    "PyYAML>=6.0",
    "Flask>=3.0",
    "requests>=2.28",
]

[project.optional-dependencies]
# Vehicle type/make/model recognition. Heavy (pulls in PyTorch) and AGPL-3.0
# licensed -- installing this is what makes a deployment subject to the AGPL.
recognition = ["ultralytics>=8.0"]
dev = ["pytest>=7.0"]

[project.scripts]
speedkam = "speedkam.cli:run_main"
speedkam-serve = "speedkam.cli:serve_main"

[project.urls]
Homepage = "https://github.com/krislovescalifornia/SpeedKam"
Source = "https://github.com/krislovescalifornia/SpeedKam"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.dynamic]
version = { attr = "speedkam.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
speedkam = ["webui/*.html"]
