# =============================================================================
# SpeedKam configuration
# Edit this file to move between machines (Windows test rig -> Raspberry Pi).
# Nothing else needs to change between platforms.
# =============================================================================

camera:
  # backend: "auto"      -> poll on boot: use the CSI camera if one is attached,
  #                         else fall back to the OpenCV source below. This is
  #                         the fleet default so one SD image works whether a
  #                         node has a Pi CSI camera or a USB webcam.
  #          "opencv"     -> force USB webcam / any cv2 source (Windows + Pi)
  #          "picamera2"  -> force Raspberry Pi native camera (CSI ribbon)
  backend: auto

  # For opencv backend: integer index (0 = default webcam) OR a path/URL to a
  # video file or RTSP stream. On Windows your Logitech cam is usually 0.
  source: 0

  width: 1456
  height: 1088
  fps: 30

  # Windows-specific: forces the DirectShow backend which is more reliable for
  # Logitech webcams. Ignored on Linux/Pi. Set false if you get a black frame.
  windows_use_dshow: true

  # Cap exposure to freeze motion (reduce blur on fast cars). -1 = auto/leave.
  # On many webcams exposure is in log2 seconds, e.g. -6 ~ 1/64s. Experiment.
  # (USB/OpenCV backend only -- see exposure_us below for the Pi CSI camera.)
  manual_exposure: -1

  # --- Raspberry Pi CSI camera (picamera2) sensor controls -------------------
  # On a GLOBAL-SHUTTER sensor (e.g. IMX296) the frame rate is bounded by the
  # exposure time. With fully-automatic exposure, libcamera picks a long
  # exposure in dim light -- which collapses FPS (2-4 fps indoors/shade) AND
  # motion-blurs fast cars. `fps` above is pushed to the sensor as a frame-
  # duration cap so exposure can't run longer than 1/fps; auto-exposure then
  # keeps brightness up with GAIN instead of time. This alone often takes a
  # dim-light node from ~2 fps to its real ceiling.
  #
  # For the sharpest edges on fast traffic, PIN a short fixed exposure. On
  # Bookworm+ libcamera we pin only the exposure and leave GAIN on auto, so
  # brightness still tracks the daylight (a fixed exposure alone over-exposes in
  # sun and goes dark at dusk). Auto already picks ~1.5 ms in bright light, so
  # this mainly holds that frozen exposure as the light DIMS instead of letting
  # auto lengthen it and blur. Pin at/below the brightest-light value so gain
  # never has to drop below 1.0 (which would over-expose). Measured on this node:
  # auto ran 1466 us at gain 1.0 in bright morning sun, so 1500 matches today and
  # only clips slightly at absolute peak sun.
  #   analogue_gain: 8.0    # ALSO pin gain (fully manual) -- usually leave 0/auto
  # 0 = leave on auto (still bounded by the fps frame-duration cap).
  exposure_us: 1500
  analogue_gain: 0

detection:
  # Minimum blob area (pixels) to count as a vehicle. Tune to your framing:
  # too small -> triggers on birds/leaves; too large -> misses distant cars.
  min_area: 1500
  max_area: 500000
  # Background-subtraction history + sensitivity.
  history: 400
  var_threshold: 40
  # Run detection on a downscaled copy of each frame (1.0 = full res). Detection
  # cost is ~linear in pixel count, so 0.5 quarters the work -- by far the
  # biggest FPS win on a Pi. Clips are still recorded at full camera resolution;
  # only the motion-detection stage sees the smaller frame, and every coordinate
  # is scaled back up, so calibration and min_area/max_area below are unchanged.
  # Drop toward 0.4 for more speed; raise toward 1.0 if small/distant vehicles
  # start getting missed.
  # Fleet default 0.4: on a Pi 3 this measurably cut detect CPU/heat (helped a
  # thermally-throttled node hold a higher fps). Raise toward 0.5-1.0 on a
  # Pi 4/5 or if small/distant vehicles start getting missed.
  detect_scale: 0.3
  # MOG2 shadow modelling. OFF is cheaper (skips a per-pixel chroma test) and is
  # the recommended default for a Pi. Trade-off: with shadows off, a hard cast
  # shadow can merge into a vehicle's blob and inflate its box; the center-band
  # gate + bottom-centre ground point mostly absorb this, but if you see speeds
  # read off shadow edges, turn this back on (and re-check min_area).
  detect_shadows: false
  # Morphology kernel size to clean up the motion mask.
  morph_kernel: 5
  # A detection must persist this many frames before it becomes a track.
  # Filters out momentary noise.
  min_hits: 3

  # --- Road-band detection ROI (FPS win) --------------------------------------
  # Run MOG2 on just the strip of road that matters instead of the whole frame.
  # Detection cost is ~linear in pixels, and on the Pi the detect loop competes
  # with the capture thread -- so cropping detection to the road band recovered
  # the pipeline from ~27fps to the sensor's ~57fps ceiling in a live harness.
  # It's safe because crossing-time speed only needs the ground-x to cross the
  # columns x_a/x_b (below), not the whole ground plane; the crop offset is added
  # back so tracking/speed coordinates are IDENTICAL to full-frame detection.
  #
  # ROLLOUT (see docs/roi-rollout-log.md): ships OFF. Turn on `audit` first --
  # it changes NOTHING about detection, just records whether every counted car
  # stays inside a candidate band and writes the observed vehicle envelope to
  # captures/roi_audit.json. Set x0..y1 from that envelope, confirm 100% coverage
  # on real traffic, THEN set enabled: true. The node refuses any band that does
  # not contain x_a/x_b, degrading to full-frame, so speed can never silently break.
  roi:
    enabled: false      # false = full-frame detection, identical to before
    audit: false        # true = log-only coverage + envelope, no crop (do this first)
    # The band as FRACTIONS of the full frame (0..1). Whole-frame defaults = no-op.
    x0: 0.0
    y0: 0.0
    x1: 1.0
    y1: 1.0

tracker:
  # Max pixel distance between frames to associate a detection with a track.
  max_match_distance: 120
  # Frames a track can go unmatched before it's finalized (car left frame).
  max_missed: 12

# --- Low-light gate ----------------------------------------------------------
# In the dark the motion detector has no real vehicles to lock onto, so it tracks
# headlight glare and sensor noise instead -- inventing phantom "cars" at absurd
# speeds (90-170 km/h) that wreck the night's stats. This gate pauses detection
# and recording once the scene goes dark, and resumes automatically at dawn.
# It's driven purely by measured frame brightness (no clock, sunset table, or
# GPS needed), and the SERVICE STAYS UP -- the dashboard and live view keep
# serving, and the camera itself notices when morning arrives. The live
# brightness reading is shown on both dashboards to make tuning easy.
light_gate:
  enabled: true
  # Mean frame brightness on a 0-255 scale. Hysteresis: it only falls asleep
  # below sleep_below and only wakes above wake_above; the gap keeps dusk/dawn
  # flicker from flapping it. Reference node measured ~90-100 in daylight, the
  # dusk collapse crossing 40 right as detection quality died, and <15 in full
  # dark -- so 40/60 sits safely in the dead zone. Watch the dashboard's
  # brightness readout at your site and adjust if your lens/exposure differ.
  sleep_below: 40
  wake_above: 60
  # Brightness must hold past a threshold this long (seconds) before the gate
  # flips -- so a passing headlight or a momentary dark truck can't toggle it.
  dwell_seconds: 30.0

speed:
  # Ignore tracks with fewer than this many samples -- avoids timing noise.
  min_samples: 6
  # Reject implausible readings (km/h).
  min_speed_kmh: 3
  max_speed_kmh: 200
  # --- SIMPLE two-line crossing-time speed --------------------------------------
  # A car crossing between image columns x_a and x_b at a KNOWN speed fixes the
  # real distance of that stretch -- one number per travel direction (d_east_m /
  # d_west_m), set by driving past once each way at a known speed (the node logs
  # the crossing time; d = known_mps * crossing_seconds -- see the /calibrate
  # page for a calculator). Every other car's speed is then that distance over
  # its own crossing time. Raw pixel x + timestamps only -- no homography, no
  # undistortion, no trajectory gates. Per node, so set these in config.local.yaml.
  # Until a direction's distance is set the node logs its crossing time and
  # reports no speed for that direction (detection-only).
  x_a: 1000
  x_b: 450
  d_east_m: null
  d_west_m: null
  # --- Automatic false-positive rejection (all PIXEL-ONLY) ----------------------
  # Cyclists, pedestrians, dogs and wind-blown foreground plants get tracked and
  # timed just like cars. Cheap pixel checks throw the junk out automatically --
  # it's still LOGGED (visible in the dashboard's auto-reject bin, restorable) but
  # kept out of every count, average and graph. All live-tunable from either
  # dashboard and persisted per node. 0 disables any individual gate.
  #   min_vehicle_aspect: a car's bounding box is WIDE (width/height ~2-3); a
  #     walking person's is TALL (~0.3-0.5), a side-on cyclist ~square (~0.9). So
  #     rejecting boxes narrower than ~1.4 throws out pedestrians, dog-walkers and
  #     cyclists while keeping cars. Lower it for a HEAD-ON mount (cars squarer).
  #   min_car_width_px: the size half of the car filter -- a car is a BIG object
  #     even in the far lane (bbox width well over 200px), while a dog, bicycle or
  #     pedestrian is small. With the aspect check above, nothing that isn't a car
  #     clears both.
  #   max_area_cv: the coefficient of variation (std/mean) of the bounding-box
  #     area across the pass. A vehicle's silhouette grows and shrinks smoothly
  #     with perspective (low CV); noise and wind-blown foliage flicker in size
  #     (high CV). 0.90 fires only on egregious flicker, so it never rejects a car.
  #   dedupe_seconds: count each drive-by ONCE -- a second confirmed pass going
  #     the same direction within this window is a fragmented re-detection of the
  #     same vehicle and is rejected.
  min_vehicle_aspect: 1.4
  min_car_width_px: 200
  max_area_cv: 0.90
  dedupe_seconds: 3.0
  # "My Road Speed Limit": flags/annotates speeders (over-limit line). This is
  # only the shipped default that seeds a newly imaged node; each node's live
  # value is editable from the dashboard and persists in its runtime state.
  speed_limit_kmh: 40.2336   # 25 mph
  # Report units shown in overlays/logs: "kmh" or "mph".
  display_units: mph
  # Human labels for the two travel directions (sign of motion along the road).
  direction_positive: "Westbound"
  direction_negative: "Eastbound"

recording:
  enabled: true
  output_dir: captures
  # Seconds of buffered video to keep so the saved clip includes the approach
  # BEFORE the trigger. The ring buffer holds roughly this many seconds of
  # wall-time -- its RAM scales with the ACTUAL frame rate, not a fixed count.
  clip_seconds: 8
  # Hard RAM ceiling for that buffer (a backstop over the time window above). A
  # 720p frame is ~2.7MB; keep it modest enough that the buffer can't exhaust
  # memory and drive the node into SD swap-thrash. 256MB (~92 720p frames) holds
  # ~3.1s of pre-roll at the full 30fps record rate below, and fits a 1GB Pi with
  # a cooler (~350MB headroom measured). Drop back to 128 if RAM gets tight.
  max_buffer_mb: 256
  # Frames/sec actually STORED for clips, independent of the detection rate. This
  # is a RAM-vs-smoothness knob, NOT an fps knob -- the detection loop runs at the
  # sensor cap regardless. 0 = store EVERY captured frame (full sensor rate) -- the
  # right setting for smoothest clips on a cooled node; paired with max_buffer_mb
  # 256 it holds ~3.1s of pre-roll at the 30fps sensor rate (measured: 30.0fps,
  # 92 frames, 3.06s). GOTCHA: do NOT set this equal to the sensor rate (e.g. 30
  # on a 30fps camera) -- the throttle drops any frame arriving < 1/record_fps
  # after the last kept one, and at the sensor rate real inter-frame jitter trips
  # that on ~1 in 4 frames, yielding ~22fps clips. Use 0 for full rate, or a value
  # WELL below the sensor rate (e.g. 15, ~3.1s pre-roll in only 128MB) to trade
  # smoothness for a longer pre-roll / less RAM on a starved node.
  record_fps: 0
  # Encode the saved CLIP at this fraction of the capture resolution (the snapshot
  # stays full-res). avc1/H.264 is slow on a Pi (~0.9s/frame at 1456x1088), and the
  # encode runs on the commit worker, so a big clip still drags detection down via
  # CPU contention. 0.5 = quarter the pixels ~= 4x faster encode and 4x smaller
  # files, still perfectly watchable -- the clip is only for viewing; speed comes
  # from detection, never the clip. 1.0 = full-res (no downscale).
  clip_scale: 0.5
  # Only save a clip when a valid speed was measured. If false, saves for every
  # tracked vehicle (useful while still calibrating).
  save_only_with_speed: true
  # Also save a single annotated JPEG snapshot at peak speed.
  save_snapshot: true
  # Draw the speed/box overlay onto the saved video (vs. clean footage).
  burn_overlay: true
  # --- SpeedKapture --------------------------------------------------------
  # Only save + off-site post a clip when the measured speed (in display_units)
  # is ABOVE this number. Below it, the pass is still COUNTED, timed, given a
  # direction and recognized -- there's just no clip taking up space. So a
  # SpeedKapture of 35 captures a car doing 35.9 mph but not one doing 34.
  # 0 = capture every vehicle. You can also change this live on the dashboard.
  speedkapture_threshold: 25
  # Save a lightweight JPEG for EVERY counted pass, even ones below the
  # SpeedKapture threshold (which get no clip). Needed so the deferred
  # recognition worker can fill in type/make/model for sub-threshold passes
  # too -- there has to be an image on disk to look at. Cheap (one JPEG/pass).
  always_snapshot: true
  # Dashboard-adjustable settings persist here (keeps config.yaml comments).
  state_file: captures/runtime.json

retention:
  # Auto-delete OLD LOCAL clips/snapshots so the Pi's SD card doesn't fill up.
  # (CSV log rows are tiny and kept forever, so your vehicle counts survive
  # even after the video is gone.)
  enabled: false
  # Delete local media older than this many days.
  local_days: 14
  # Only delete media that off-site backup has CONFIRMED uploaded. Keep this
  # true whenever backup is on. If backup is disabled, set it false to allow
  # plain age-based cleanup (otherwise nothing is ever deleted).
  require_backup: true
  # How often the cleanup sweep runs (seconds).
  interval_seconds: 3600

display:
  # Show a live preview window. Set false for headless Pi deployment.
  show_window: true
  # Draw the calibrated measurement zone + detection boxes on the live view.
  draw_debug: true

logging:
  # CSV of every event: timestamp, id, speed, direction, clip path.
  csv_file: captures/events.csv

web:
  # Web dashboard (serve.py): live view, recent clips, browser calibration.
  # host 0.0.0.0 = reachable from other devices on your LAN (phone/laptop).
  host: 0.0.0.0
  port: 8080
  # Optional HTTP Basic Auth. Leave password empty for an open dashboard (fine on
  # a trusted home LAN). Set a password to require login for EVERYTHING -- pages,
  # APIs, the live stream, and captured media. Put the real password in
  # config.local.yaml (it's a secret), not here. Recommended if the camera shares
  # a network with devices/people you don't fully trust.
  auth:
    username: admin
    password: ""
  # Restart/Shutdown buttons on the dashboard that reboot or power off the whole
  # Pi (via a sudoers rule installed by install-service.sh). Set false to hide
  # them and refuse the endpoint. NOTE: a shutdown on a remote/headless node
  # can only be undone by physically power-cycling it -- keep that in mind before
  # exposing it on a network you don't fully trust.
  allow_power_control: true
  # Max frames/sec the live MJPEG preview is JPEG-encoded at. The encode is a
  # real cost on the capture core, so it is capped here. The detection loop
  # always runs at full speed; this only limits preview refresh. 0 = unthrottled.
  stream_fps: 10
  # Downscale the live preview to this width before encoding. The browser view
  # doesn't need full camera resolution, and encoding a 1280x720 JPEG costs
  # ~34ms on a Pi 3 vs ~8ms at 640 wide -- a big win. 0 = full resolution.
  stream_max_width: 640

netcfg:
  # Wi-Fi onboarding for headless nodes (speedkam-netcfg.service). On boot, if
  # the node can't reach the internet, it raises its own Wi-Fi access point named
  # "SpeedKam-Setup-<nodeid>" and serves a phone-friendly setup page. Connect a
  # phone to that AP, pick a nearby network, type the password -- the node joins
  # it, saves the profile (so it auto-joins forever after), and tears the AP
  # down. That's how you move a node to a NEW site with no screen, no SSH, and no
  # re-imaging. Boots where the node is already online are a silent no-op.
  #
  # This is onboarding, not evasion: it only joins a network you're standing in
  # front of and authorised to use. A node that's online but walled off from LAN
  # peers (e.g. a guest network) counts as online and is left alone.
  enabled: true
  interface: wlan0
  ap_ssid_prefix: SpeedKam-Setup
  # Blank = OPEN setup AP (easiest; it's only up while offline and torn down the
  # instant the node joins a real network). Set 8+ chars to lock it with WPA2.
  ap_password: ""
  # Seconds to wait for real connectivity at boot before opening the setup AP.
  online_timeout: 90
  portal_title: "SpeedKam Wi-Fi setup"
  # NetworkManager 'shared'-mode gateway = the portal's address. Only change if
  # it clashes with a site network you're joining.
  captive_ip: "10.42.0.1"

backup:
  # Off-site backup: mirror every event (CSV row + snapshot + clip) to a web
  # domain you own, so records survive if the camera is damaged or stolen.
  # Local internal storage always keeps everything regardless of this.
  #
  # Setup: put deploy/webhost/speedkam_receiver.php on your site, pick a long
  # random secret, set the same secret in BOTH places, then set enabled: true.
  #
  # FLEET NOTE: every node shares this one backup domain. Set the real `url` and
  # `secret` ON THE GOLDEN MASTER before you capture the image (they then ride
  # along on every clone). provision.sh refuses to build an image while the
  # secret is still the CHANGE-ME placeholder, so you can't ship a broken fleet.
  enabled: true
  # Real url + secret live in config.local.yaml (untracked; deep-merged over this
  # file at load time). Keep the placeholders here so config.yaml stays shareable.
  url: "https://yourdomain.example/speedkam/speedkam_receiver.php"
  secret: "CHANGE-ME-to-a-long-random-string"
  include_snapshots: true
  include_clips: true          # false = back up metadata + snapshots only
  # Full historical mirror: back up EVERY counted pass off-site (its CSV row +
  # snapshot), not just captured (above-SpeedKapture) clips. With this on, the
  # remote holds a complete record, so when local retention trims old media the
  # off-site copy still has everything. Clips still only exist above threshold
  # (there's nothing to film below it) -- but every row and snapshot is mirrored.
  mirror_all: true
  verify_tls: true             # keep true; only disable for self-signed hosts
  timeout: 30
  # If an upload fails (Pi offline), events queue on disk and retry every N s.
  retry_seconds: 60
  # Remote rotation: ask the receiver to delete OFF-SITE media older than this
  # many days so the remote host doesn't fill up. 0 = keep forever. This is a
  # DIFFERENT knob from retention.local_days -- local and remote rotate apart.
  remote_retention_days: 0

control:
  # Pull-based remote control + heartbeat. The camera periodically checks in with
  # the off-site host (reusing backup.url + backup.secret above), reports its
  # status so the web dashboard shows liveness + counts even when you're away,
  # and adopts any settings you changed on the dashboard (e.g. the SpeedKapture
  # threshold). This is how you control a camera behind home NAT -- it reaches
  # out; nothing has to reach in. Needs backup.enabled with a valid url/secret.
  enabled: true
  # How often the camera checks in / pulls settings (seconds).
  poll_seconds: 30

recognition:
  # Optional, best-effort vehicle attributes (type / make / model / year /
  # color). Fully optional: with this off -- or ultralytics/torch not installed
  # -- every pass is still counted and timed, attributes just stay blank.
  # Heavy on a Pi; enable once you've added a model and tested throughput.
  enabled: true
  # OFFLOADED recognition. true = this node does NOT run the heavy YOLO models
  # (color only), and a separate machine runs tools/recognize_worker.py later to
  # fill in type/make/model. Only worth it on a BUSY road. For a low-traffic
  # private drive keep this FALSE: the Pi recognizes each car inline (it only
  # runs YOLO once per pass, with long gaps between cars), and nothing else has
  # to run anywhere -- the off-site host just stores and displays the results.
  #
  # SET TO true ON THE PI 3: inline YOLO ran on the capture thread and stalled
  # the loop for ~1-5s per car (pinning fps ~3 with two cores idle). Deferring
  # keeps the cheap inline color pass and offloads type/make/model to a worker.
  defer: true
  # YOLO weights for vehicle TYPE (COCO classes: car/truck/bus/motorcycle).
  # Used by the worker (ignored on a defer node). Downloaded by ultralytics.
  model: yolov8n.pt
  min_confidence: 0.35
  # Estimate the dominant body color from the crop (cheap, no model needed).
  color: true
  # (Fine-grained make/model/year recognition was dropped -- low value, a heavy
  # weight we're not paying for. The make/model/year fields stay in the schema
  # but always blank.)

  # --- YOLO gate: the classifier as the gate of record (Phase 14) -----------
  # On a board that can run the detector (Pi 4 / 8 GB, 64-bit, ultralytics+torch
  # installed, and defer:false so the model actually loads), promote YOLO from
  # best-effort enrichment to the CAR-VS-NOT decider. Once per finished pass, on
  # a worker thread (never the detection loop), it samples several frames across
  # the track and votes: a pass with too few vehicle frames -- and especially
  # ZERO in good light -- is rejected as a phantom / on-road pedestrian, the
  # false positive the geometry gates provably cannot catch (an empty road that
  # reads as a plausible car). Geometry stays on for location + speed sanity;
  # an object must clear BOTH. Leave enabled:false on geometry-only nodes.
  gate:
    enabled: false
    # Inference size. 320 is the Pi-4 sweet spot: ~0.7 s/frame vs ~2.3 s at 640.
    # At 320 the detector emits faint phantom "cars" (<=0.55) that 640 doesn't,
    # so the gate leans on min_confidence below rather than a bigger, slower
    # image. Measured on the board; don't assume.
    imgsz: 320
    # The gate's OWN detection-confidence floor (separate from the enrichment
    # min_confidence above). 0.60 cleanly splits empty-road phantoms (best 0.41-
    # 0.54 at imgsz 320) from real cars (0.86-0.91) -- validated 7/7 on the
    # labelled regression clips (tools/yolo_validate.py). Raise if phantoms leak.
    min_confidence: 0.60
    # Frames sampled evenly across the pass, and the minimum of them that must
    # contain a vehicle to KEEP. A real car shows in ~70% of frames (30-34/45 in
    # validation), a phantom in none -- so 2 of 6 is safe and forgiving of the
    # entering/leaving frames where the car is marginal. Fewer frames = lower
    # per-pass latency on the worker thread (6 x ~0.7 s ~= 4 s/pass at imgsz 320).
    vote_frames: 6
    min_vehicle_frames: 2
    # What to do when the vote is nonzero but under the threshold (a
    # tiny/distant/blurry crop the model was unsure about):
    #   geometry -> defer to the geometry gates (default, safest: don't drop a
    #               real car the model merely wasn't confident about)
    #   reject   -> treat as junk
    #   keep     -> count it
    low_confidence_fallback: geometry
    # A zero-vehicle pass is hard-rejected only when the scene is at least this
    # bright (0-255 mean luma): YOLO degrades in the dark, so a dim scene defers
    # to geometry instead of inventing rejections. The low-light gate usually
    # pauses detection before it gets this dark anyway. 0 disables the guard.
    min_reject_brightness: 60
    # COCO classes counted as "not a vehicle" nuisances (names or ids). Empty =
    # person, bicycle, cat, dog. (Vehicles are always car/truck/bus/motorcycle.)
    nuisance_classes: []
